<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語学習クイズ</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 30px;
        }

        /* クイズのメイン文字を大きく */
        #question-display {
            font-size: 4.5rem; /* 非常に大きく */
            font-weight: bold;
            margin: 30px 0;
            color: var(--primary-color);
            min-height: 1.2em;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }

        /* 選択肢ボタンのレイアウト */
        .option-btn {
            background: white;
            border: 2px solid #ddd;
            padding: 20px;
            font-size: 1.8rem; /* 文字を大きく */
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        /* 正解・不正解のフィードバック */
        .correct {
            background-color: var(--success-color) !important;
            color: white !important;
            border-color: var(--success-color) !important;
        }

        .wrong {
            background-color: var(--error-color) !important;
            color: white !important;
            border-color: var(--error-color) !important;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #score-display {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-speak {
            background: #eee;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>読み方クイズ</h1>
    <button class="btn-speak" onclick="repeatQuestion()">🔊 音声を聴く</button>
    <div id="question-display">...</div>
    <div class="options-grid" id="options-container">
        </div>
    <div id="score-display">スコア: 0</div>
</div>

<script>
    // クイズデータ（ここを自由に変更してください）
    const quizData = [
        { q: "山", a: ["やま", "かわ", "うみ"], correct: "やま" },
        { q: "犬", a: ["ねこ", "いぬ", "とり"], correct: "いぬ" },
        { q: "食べる", a: ["ねる", "のむ", "たべる"], correct: "たべる" },
        { q: "先生", a: ["がくせい", "せんせい", "いしゃ"], correct: "せんせい" },
        { q: "青い", a: ["あおい", "あかい", "しろい"], correct: "あおい" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    function initQuiz() {
        showQuestion();
    }

    function showQuestion() {
        const question = quizData[currentQuestionIndex];
        const display = document.getElementById('question-display');
        const optionsContainer = document.getElementById('options-container');
        
        display.innerText = question.q;
        optionsContainer.innerHTML = '';

        // 音声を再生
        speak(question.q);

        // 選択肢をシャッフル
        const shuffledOptions = [...question.a].sort(() => Math.random() - 0.5);

        shuffledOptions.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(option, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        const question = quizData[currentQuestionIndex];
        const allButtons = document.querySelectorAll('.option-btn');
        
        // 全ボタンを無効化
        allButtons.forEach(b => b.style.pointerEvents = 'none');

        if (selected === question.correct) {
            btn.classList.add('correct');
            score++;
            speak("正解です！");
        } else {
            btn.classList.add('wrong');
            speak("違います");
            // 正解のボタンを強調
            allButtons.forEach(b => {
                if(b.innerText === question.correct) b.classList.add('correct');
            });
        }

        document.getElementById('score-display').innerText = `スコア: ${score}`;

        // 1.5秒後に次の問題へ
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }, 1500);
    }

    // 日本語の発音設定
    function speak(text) {
        window.speechSynthesis.cancel(); // 再生中の音声を止める
        const uttr = new SpeechSynthesisUtterance(text);
        
        // 音声リストを取得
        const voices = window.speechSynthesis.getVoices();
        // 日本語（Google または システム）を選択
        const jpVoice = voices.find(v => v.lang === 'ja-JP' || v.lang.includes('Japanese'));
        
        if (jpVoice) uttr.voice = jpVoice;
        
        uttr.lang = 'ja-JP';
        uttr.rate = 0.85;  // 少しゆっくり（聞き取りやすく）
        uttr.pitch = 1.1;  // 少し高め（明るい声）
        
        window.speechSynthesis.speak(uttr);
    }

    function repeatQuestion() {
        speak(quizData[currentQuestionIndex].q);
    }

    function finishQuiz() {
        const container = document.querySelector('.quiz-container');
        container.innerHTML = `
            <h2>終了！</h2>
            <p style="font-size: 1.5rem;">あなたのスコアは ${score} / ${quizData.length} です。</p>
            <button class="option-btn" onclick="location.reload()" style="width:100%">もう一度挑戦</button>
        `;
    }

    // 音声読み込み完了を待って開始
    window.speechSynthesis.onvoiceschanged = initQuiz;
    // 最初の読み込み用
    if (window.speechSynthesis.getVoices().length > 0) initQuiz();

</script>

</body>
</html>
